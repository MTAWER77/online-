<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="NOVA AI - مساعد ذكي">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>NOVA AI</title>
<link rel="stylesheet" href="/styles.css">


</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand">NOVA <b>AI</b></div>

    <button id="newChat" class="btn primary" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>محادثة جديدة</span>
    </button>

    <div class="side-label">المحادثات</div>
    <nav id="chatList" class="chat-list" aria-label="المحادثات"></nav>

    <button id="settingsBtn" class="btn ghost" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
      </svg>
      <span>الإعدادات</span>
    </button>
  </aside>

  <div id="scrim" class="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <h1 id="title">NOVA AI</h1>
      <button id="installBtn" type="button" hidden></button>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <div class="composer-wrap">
      <div id="attachmentTray" class="attachment-tray" hidden></div>

      <form id="composer" class="composer">
        <button id="attachBtn" class="attach-btn" type="button" aria-label="إرفاق ملف" title="إرفاق ملف">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>

        <textarea id="input" rows="1" dir="auto" maxlength="8000" placeholder="اكتب رسالتك... / Message NOVA AI"></textarea>

        <button id="searchToggle" class="search-toggle" type="button"
          aria-label="تفعيل البحث على الويب" aria-pressed="false"
          title="البحث على الويب">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="m16 16 4.5 4.5"/>
            <path d="M8.2 10.8h5.2M10.8 8.2v5.2"/>
          </svg>
          <span>بحث</span>
        </button>

        <button id="thinkToggle" class="think-toggle" type="button"
          aria-label="تفعيل وضع التفكير" aria-pressed="false" title="تفكير أعمق">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18h6M10 22h4M8 14.5a6 6 0 1 1 8 0c-.8.7-1 1.2-1 2.5H9c0-1.3-.2-1.8-1-2.5Z"/>
            <path d="M12 2v2M4.9 4.9l1.4 1.4M19.1 4.9l-1.4 1.4"/>
          </svg>
          <span>Think</span>
        </button>

        <button id="sendBtn" class="send" type="submit" aria-label="إرسال">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </form>

      <div id="attachMenu" class="attach-menu" hidden>
        <button type="button" data-attach="file">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>
          <span>رفع ملفات</span>
        </button>

        <button type="button" data-attach="image">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          <span>رفع صور</span>
        </button>
      </div>

      <input type="file" id="fileInput" multiple accept=".gd,.tscn,.tres,.gdshader,.shader,.godot,.json,.cfg,.ini,.txt,.md,.csv,.xml,.html,.css,.js,.py,.log" hidden>
      <input type="file" id="imageInput" multiple accept="image/jpeg,image/png,image/webp,image/gif" hidden>

      <p class="foot-note">قد يخطئ NOVA AI. راجع المعلومات المهمة. · NOVA AI may make mistakes.</p>
    </div>
  </main>
</div>

<dialog id="settings" class="modal">
  <div class="modal-head">
    <h2>الإعدادات</h2>
    <button id="closeSettings" class="icon-btn show" type="button" aria-label="إغلاق">✕</button>
  </div>

  <div class="set-row">
    <span>حجم الخط</span>
    <div class="seg" id="fontSeg">
      <button type="button" data-fs="s">صغير</button>
      <button type="button" data-fs="m">متوسط</button>
      <button type="button" data-fs="l">كبير</button>
    </div>
  </div>

  <div class="set-row">
    <span>تصدير المحادثات (JSON)</span>
    <button id="exportBtn" class="btn small" type="button">تصدير</button>
  </div>

  <div class="set-row">
    <span>حذف كل المحادثات</span>
    <button id="clearBtn" class="btn small danger" type="button">حذف الكل</button>
  </div>

  <p class="about">NOVA AI · Groq · المحادثات تُحفظ على جهازك فقط.</p>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="/render.js"></script>
<script src="/app.js"></script>
</body>
</html>
