<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="description" content="NOVA AI - مساعد ذكي">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>NOVA AI</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><img src="/icon.svg" width="28" height="28" alt=""><span>NOVA AI</span></div>
    <button id="newChat" class="btn primary" type="button">＋ محادثة جديدة</button>
    <nav id="chatList" class="chat-list" aria-label="المحادثات"></nav>
    <div class="side-foot">NOVA AI V0.1</div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="القائمة">☰</button>
      <h1 id="title">NOVA AI</h1>
      <button id="installBtn" class="btn small" type="button" hidden>تثبيت</button>
    </header>
    <section id="messages" class="messages" aria-live="polite"></section>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" dir="auto" maxlength="8000" placeholder="اكتب رسالتك... / Type a message..."></textarea>
      <button id="sendBtn" class="send" type="submit" aria-label="إرسال">➤</button>
    </form>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
