<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<script>(function(){try{var m=localStorage.getItem("nova-theme")||"auto";var d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
<meta name="description" content="NOVA AI - مساعد ذكي">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>NOVA AI</title>
<link rel="stylesheet" href="/styles.css">


</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand">NOVA <b>AI</b></div>

    <button id="newChat" class="btn primary" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>محادثة جديدة</span>
    </button>

    <div class="side-label">المحادثات</div>
    <nav id="chatList" class="chat-list" aria-label="المحادثات"></nav>

    <button id="quotaBox" class="user-box quota-box" type="button" hidden><span id="quotaText"></span></button>

    <button id="settingsBtn" class="btn ghost" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
      </svg>
      <span>الإعدادات</span>
    </button>
  </aside>

  <div id="scrim" class="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <h1 id="title">NOVA AI</h1>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="الوضع الداكن" title="الوضع الداكن / الفاتح"></button>
      <button id="installBtn" type="button" hidden></button>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <div class="composer-wrap">
      <button id="toBottom" class="to-bottom" type="button" aria-label="الانتقال لآخر الرد" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
      <div id="attachmentTray" class="attachment-tray" hidden></div>

      <div id="modeBar" class="mode-bar" role="group" aria-label="أوضاع NOVA">
        <button id="thinkToggle" class="mode-chip" type="button" aria-pressed="false" title="تفكير عميق قبل الرد (يظهر تفكير النموذج)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M8 14.5a6 6 0 1 1 8 0c-.8.7-1 1.2-1 2.5H9c0-1.3-.2-1.8-1-2.5Z"/></svg>
          <span>DeepThink</span>
        </button>
        <button id="searchToggle" class="mode-chip" type="button" aria-pressed="false" title="بحث على الويب مع مصادر">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
          <span>Search</span>
        </button>
      </div>

      <form id="composer" class="composer">
        <button id="attachBtn" class="attach-btn" type="button" aria-label="إرفاق" title="إرفاق">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" dir="auto" maxlength="8000" enterkeyhint="send" autocomplete="off" placeholder="اكتب رسالتك…"></textarea>
        <button id="sendBtn" class="send" type="submit" aria-label="إرسال">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>

      <div id="attachMenu" class="attach-menu attach-sheet" role="menu" hidden>
        <button type="button" data-attach="camera"><span class="attach-ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><span class="attach-label">الكاميرا</span></button>
        <button type="button" data-attach="image"><span class="attach-ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></span><span class="attach-label">الصور</span></button>
        <button type="button" data-attach="file"><span class="attach-ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6m-3 3 3-3 3 3"/></svg></span><span class="attach-label">الملفات</span></button>
      </div>

      <input type="file" id="fileInput" multiple accept=".zip,.pdf,.gd,.tscn,.tres,.gdshader,.shader,.godot,.json,.cfg,.ini,.txt,.md,.csv,.xml,.html,.css,.js,.py,.log" hidden>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="imageInput" multiple accept="image/jpeg,image/png,image/webp,image/gif" hidden>
      <input type="file" id="zipInput" accept=".zip,application/zip,application/x-zip-compressed" hidden>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>

      <p class="foot-note">قد يخطئ NOVA AI. راجع المعلومات المهمة. · NOVA AI may make mistakes.</p>
    </div>
  </main>
</div>

<dialog id="settings" class="modal">
  <div class="modal-head">
    <h2>الإعدادات</h2>
    <button id="closeSettings" class="icon-btn show" type="button" aria-label="إغلاق">✕</button>
  </div>

  <div class="set-row">
    <span>حجم الخط</span>
    <div class="seg" id="fontSeg">
      <button type="button" data-fs="s">صغير</button>
      <button type="button" data-fs="m">متوسط</button>
      <button type="button" data-fs="l">كبير</button>
    </div>
  </div>

  <div class="set-row">
    <span>المظهر</span>
    <div class="seg" id="themeSeg">
      <button type="button" data-theme-mode="light">فاتح</button>
      <button type="button" data-theme-mode="dark">داكن</button>
      <button type="button" data-theme-mode="auto">تلقائي</button>
    </div>
  </div>

  <div class="act-row" id="activateRow" hidden>
    <div class="act-head"><span>كود التفعيل</span><small id="codeState"></small></div>
    <div class="code-line" id="codeForm">
      <input id="codeInput" type="text" dir="ltr" placeholder="اكتب الكود هنا" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64">
      <button id="codeBtn" class="btn small" type="button">تفعيل</button>
    </div>
    <button id="codeOff" class="btn small" type="button" hidden>إلغاء التفعيل</button>
    <p id="codeMsg" class="code-msg" hidden></p>
  </div>

  <div class="set-row">
    <span>تصدير المحادثات (JSON)</span>
    <button id="exportBtn" class="btn small" type="button">تصدير</button>
  </div>

  <div class="set-row">
    <span>حذف كل المحادثات</span>
    <button id="clearBtn" class="btn small danger" type="button">حذف الكل</button>
  </div>

  <p class="about">NOVA AI · Groq / Gemini / OpenRouter · المحادثات تُحفظ على جهازك فقط.</p>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="/render.js"></script>
<script src="/godot.js"></script>
<script src="/tasks.js"></script>
<script src="/context.js"></script>
<script src="/pdf.js"></script>
<script src="/app.js"></script>
</body>
</html>
